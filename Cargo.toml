[package]
name = "phoenix_fintech"
version = "1.0.0"
edition = "2021"
authors = ["Adam Clark <savagetism@icloud.com>"]
license = "Proprietary"
description = "Tier-1 concurrent cryptographic logging kernel and adversarial engine for finance & compliance."

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
libc = "0.2"

[package]
name = "sovereign_ledger"
version = "0.3.0"
edition = "2021"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/sovereign_ledger"
license = "LicenseRef-Proprietary"
description = "Standalone hardened, hash-chained audit ledger with memory-pinned keys, inter-process locking, and fail-closed verification"
keywords = ["audit", "ledger", "tamper-evident", "hash-chain", "security"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
libc = "0.2"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }

[dev-dependencies]
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"

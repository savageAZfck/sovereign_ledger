# cargo-deny configuration for sovereign_ledger.
# Run: cargo deny check

[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
ignore = []

[licenses]
# The crate itself is FSL-1.1-ALv2; dependencies must remain standard
# permissive licenses so downstream verification tooling can vendor freely.
allow = [
    "FSL-1.1-ALv2",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
# Keep the tree lean: no duplicate major versions of anything we control
# the surface of, and no known-problem crates.
multiple-versions = "warn"
skip = []
deny = []

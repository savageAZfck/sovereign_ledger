name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
      id-token: write # cosign keyless OIDC identity
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/sovereign_ledger \
            target/x86_64-apple-darwin/release/sovereign_ledger \
            -output dist/sovereign_ledger
          tar -czf "dist/sovereign_ledger-${GITHUB_REF_NAME}-macos-universal.tar.gz" -C dist sovereign_ledger
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS.txt)
      - name: Sign artifacts (keyless, Rekor-logged)
        run: |
          cosign sign-blob --yes \
            --bundle "dist/sovereign_ledger-${GITHUB_REF_NAME}-macos-universal.tar.gz.sigstore.json" \
            "dist/sovereign_ledger-${GITHUB_REF_NAME}-macos-universal.tar.gz"
          cosign sign-blob --yes \
            --bundle "dist/SHA256SUMS.txt.sigstore.json" \
            dist/SHA256SUMS.txt
      - name: Upload release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Universal macOS binary, keyless-signed via Sigstore from this repo's CI. Verify: cosign verify-blob --bundle <artifact>.sigstore.json --certificate-identity-regexp 'github.com/savageAZfck/sovereign_ledger' --certificate-oidc-issuer https://token.actions.githubusercontent.com <artifact>. Remove quarantine after download (xattr -d com.apple.quarantine)." \
            dist/* || \
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
